<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zakamarki</title>
  <meta name="theme-color" content="#f1e7dc">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Trzy kroje o płynnej grubości (wersje zmienne) w jednym arkuszu; przeglądarka pobiera
       plik fontu dopiero, gdy krój jest użyty. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap">
  <!-- Interfejs: Inter Tight. Nazwa aplikacji: Fraunces Black Soft, pobierany tylko dla liter „Zakamarki”. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400..700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,900,100&text=Zakamarki&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    // Tło czytnika i dzienna/nocna wersja palety ustawione przed pierwszym rysowaniem,
    // żeby nie mignęły domyślne. Ta sama logika co resolvePage() w app.js.
    try {
      var r = JSON.parse(localStorage.getItem('zakamarki:reader') || '{}');
      var dark = matchMedia('(prefers-color-scheme: dark)').matches;
      var page = !r.page || r.page === 'auto' ? (dark ? 'grafit' : 'papier') : r.page;
      document.documentElement.dataset.page = page;
      document.documentElement.dataset.scheme = (page === 'grafit' || page === 'kakao') ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="progress" aria-hidden="true"></div>

  <header class="bar">
    <a href="#" class="brand" aria-label="Zakamarki — start">Zakamarki</a>
    <form id="search-form" class="search" role="search" autocomplete="off">
      <input id="search" type="search" placeholder="Szukaj w Wikipedii" enterkeyhint="search" aria-label="Szukaj w Wikipedii">
      <ul id="suggestions" class="suggestions" hidden></ul>
    </form>
    <button id="search-toggle" class="round" type="button" aria-label="Szukaj" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 L20 20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main>
    <section id="view-home" class="view home">
      <!-- Nagłówek z liczb dnia: wielka liczba + dwie linijki obok, wyrównane do jej dołu. -->
      <div id="hero" class="hero-num">
        <div id="hero-num" class="hero-big"></div>
        <div class="hero-unit"><span id="hero-unit"></span><small id="hero-sub"></small></div>
      </div>
      <button id="hero-search" class="pill-ink" type="button" hidden>Szukaj hasła</button>

      <!-- „Czytaj dalej”: karta z miniaturą bieżącego hasła; cała karta jest przyciskiem. -->
      <a id="continue" class="next-card" href="#" hidden>
        <span class="next-img" aria-hidden="true"></span>
        <span class="next-txt"><span class="next-lab">Czytaj dalej</span><span class="next-t"></span><span class="next-s"></span></span>
        <span class="next-go" aria-hidden="true">→</span>
      </a>

      <div class="sec-head"><h2>Przypięte</h2><span id="saved-count" class="sec-count"></span></div>
      <div class="shelf-wrap">
        <div class="shelf-glass" aria-hidden="true"></div>
        <div id="shelf" class="shelf"></div>
      </div>

      <div class="card">
        <div class="sec-head"><h2>Tropy</h2><span id="trails-count" class="sec-count"></span></div>
        <ol id="trails-list" class="numbered"></ol>
      </div>

      <div class="card">
        <div class="sec-head"><h2>Ostatnio otwarte</h2></div>
        <ul id="history-list" class="list"></ul>
      </div>

      <!-- Kopia zapasowa: plik JSON z historią, tropami, przypiętymi, ustawieniami i presetami. -->
      <div class="card backup">
        <div class="sec-head"><h2>Kopia zapasowa</h2><span id="backup-age" class="sec-count"></span></div>
        <p id="backup-info" class="backup-info"></p>
        <div class="backup-row">
          <button id="backup-save" class="pill-ink" type="button">Zapisz kopię</button>
          <label class="pill-line">Wczytaj kopię<input id="backup-load" type="file" accept="application/json,.json" hidden></label>
        </div>
        <p id="backup-msg" class="backup-msg" role="status" hidden></p>
      </div>
    </section>

    <section id="view-results" class="view" hidden>
      <h2 class="label" id="results-label">Wyniki</h2>
      <ul id="results-list" class="list"></ul>
    </section>

    <section id="view-reader" class="view" hidden>
      <nav id="trail" class="trail" aria-label="Bieżący trop"></nav>
      <div class="reader-head">
        <h1 id="article-title"></h1>
        <div class="reader-tools">
          <button id="aa" class="aa" type="button" aria-expanded="false" aria-controls="sheet" aria-label="Ustawienia czytania">Aa</button>
          <button id="pin" class="pin" type="button" aria-pressed="false">Przypnij</button>
        </div>
      </div>
      <p id="status" class="status" hidden></p>
      <article id="article" class="article"></article>
      <footer id="attribution" class="attribution"></footer>
    </section>
  </main>

  <div id="note" class="note" role="tooltip" hidden></div>

  <div id="sheet-catcher" class="sheet-catcher" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-label="Ustawienia czytania" hidden>
    <div class="sheet-inner">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="sheet-head"><button id="sheet-done" class="sheet-done" type="button">Gotowe</button></div>

      <!-- Presety na wierzchu: kafle w swoich kolorach i kroju; „＋” zapisuje bieżące ustawienia. -->
      <div id="presets" class="pcards" role="group" aria-label="Presety"></div>
      <form id="preset-form" class="preset-row" autocomplete="off" hidden>
        <input id="preset-name" type="text" maxlength="24" placeholder="Nazwa" enterkeyhint="done" aria-label="Nazwa presetu">
        <button class="choice" type="submit">Zapisz</button>
      </form>

      <!-- Szczegóły bez podpisów: same próbki; nazwy tylko dla czytnika ekranu (aria-label). -->
      <details id="tune" class="tune">
        <summary>Dostosuj <span class="chev" aria-hidden="true"></span></summary>
        <div class="tiles tiles-7" id="set-page" role="group" aria-label="Tło"></div>
        <div class="tiles" id="set-font" role="group" aria-label="Krój"></div>
        <div class="tiles" id="set-weight" role="group" aria-label="Grubość"></div>
        <div class="slider">
          <span class="ico" style="font-size:13px" aria-hidden="true">A</span>
          <input id="set-size" type="range" min="14" max="26" step="1" aria-label="Wielkość">
          <span class="ico" style="font-size:22px" aria-hidden="true">A</span>
        </div>
        <div class="slider">
          <span class="lines" aria-hidden="true"><i></i><i></i><i></i></span>
          <input id="set-leading" type="range" min="1.3" max="2.1" step="0.05" aria-label="Interlinia">
          <span class="lines loose" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>
        <div class="slider wide-only">
          <span class="cols" aria-hidden="true"></span>
          <input id="set-measure" type="range" min="26" max="48" step="1" aria-label="Szerokość kolumny">
          <span class="cols wide" aria-hidden="true"></span>
        </div>
        <button id="sheet-reset" class="sheet-reset" type="button">Domyślne</button>
      </details>
    </div>
  </section>

  <!-- Szybki powrót w czytniku: pojawia się przy przewijaniu w górę. -->
  <div id="float" class="float" hidden>
    <a id="back-step" class="back-step" href="#"><span aria-hidden="true">←</span> <span class="t"></span></a>
    <button id="to-top" class="fab" type="button" aria-label="Na górę">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>

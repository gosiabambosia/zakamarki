<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zakamarki</title>
  <meta name="theme-color" content="#0d1326">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Trzy kroje w jednym arkuszu; przeglądarka pobiera pliki fontu dopiero, gdy krój jest użyty. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    // Motyw ustawiony przed pierwszym rysowaniem strony, żeby nie mignął domyślny.
    try {
      var r = JSON.parse(localStorage.getItem('zakamarki:reader') || '{}');
      if (r.theme && r.theme !== 'auto') document.documentElement.dataset.theme = r.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="progress" aria-hidden="true"></div>

  <header class="bar">
    <a href="#" class="brand" aria-label="Zakamarki — start">Zakamarki</a>
    <form id="search-form" class="search" role="search" autocomplete="off">
      <input id="search" type="search" placeholder="Szukaj w Wikipedii" enterkeyhint="search" aria-label="Szukaj w Wikipedii">
      <ul id="suggestions" class="suggestions" hidden></ul>
    </form>
  </header>

  <main>
    <section id="view-home" class="view">
      <h2 class="label">Przypięte</h2>
      <ul id="saved-list" class="list"></ul>

      <h2 class="label">Ostatni trop</h2>
      <ol id="last-trail" class="trail-static"></ol>

      <h2 class="label">Ostatnio otwarte</h2>
      <ul id="history-list" class="list"></ul>
    </section>

    <section id="view-results" class="view" hidden>
      <h2 class="label" id="results-label">Wyniki</h2>
      <ul id="results-list" class="list"></ul>
    </section>

    <section id="view-reader" class="view" hidden>
      <nav id="trail" class="trail" aria-label="Bieżący trop"></nav>
      <div class="reader-head">
        <h1 id="article-title"></h1>
        <div class="reader-tools">
          <button id="aa" class="aa" type="button" aria-expanded="false" aria-controls="sheet" aria-label="Ustawienia czytania">Aa</button>
          <button id="pin" class="pin" type="button" aria-pressed="false">Przypnij</button>
        </div>
      </div>
      <p id="status" class="status" hidden></p>
      <article id="article" class="article"></article>
      <footer id="attribution" class="attribution"></footer>
    </section>
  </main>

  <div id="note" class="note" role="tooltip" hidden></div>

  <div id="sheet-catcher" class="sheet-catcher" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-label="Ustawienia czytania" hidden>
    <div class="sheet-inner">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2>Czytanie</h2>
        <button id="sheet-done" class="sheet-done" type="button">Gotowe</button>
      </div>

      <div class="field"><div class="field-label">Motyw</div><div class="choices" id="set-theme"></div></div>
      <div class="field"><div class="field-label">Krój</div><div class="choices" id="set-font"></div></div>
      <div class="field"><div class="field-label">Kolor tekstu</div><div class="choices" id="set-tone"></div></div>
      <div class="field">
        <label class="field-label" for="set-size">Wielkość <output id="out-size"></output></label>
        <input id="set-size" type="range" min="14" max="26" step="1">
      </div>
      <div class="field">
        <label class="field-label" for="set-leading">Interlinia <output id="out-leading"></output></label>
        <input id="set-leading" type="range" min="1.3" max="2.1" step="0.05">
      </div>
      <div class="field">
        <label class="field-label" for="set-measure">Szerokość kolumny <output id="out-measure"></output></label>
        <input id="set-measure" type="range" min="26" max="48" step="1">
      </div>

      <div class="field">
        <div class="field-label">Presety</div>
        <form id="preset-form" class="preset-row" autocomplete="off">
          <input id="preset-name" type="text" maxlength="24" placeholder="Nazwa, np. Wieczór" enterkeyhint="done">
          <button class="choice" type="submit">Zapisz</button>
        </form>
        <div id="presets" class="presets"></div>
      </div>

      <button id="sheet-reset" class="sheet-reset" type="button">Przywróć domyślne</button>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
